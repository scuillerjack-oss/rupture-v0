<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>RUPTURE — hors ligne</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0f14; color: #e8ecf1; font-family: -apple-system, Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center; }
    h1 { margin: 0; color: #e06b2d; letter-spacing: 0.12em; }
    p { margin: 0; color: #9aa5b1; max-width: 300px; line-height: 1.45; }
    button { padding: 14px 28px; border: 0; border-radius: 12px; background: #e06b2d; color: #0b0f14; font-size: 1rem; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>RUPTURE</h1>
    <p>La bêta charge le jeu depuis Internet. Connecte-toi une première fois : ensuite, il reste disponible hors ligne.</p>
    <button onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
